name: CI

# Continuous integration only: no release, publish or deploy jobs (by design).
# The suite is Linux-tuned (ping -c/-W), runs on the standard library alone and
# must not install any third-party Python packages (SPEC §3).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile package, tests and scripts
        run: python -m compileall -q hostping tests scripts

      - name: Run the standard-library unittest suite
        run: python -m unittest discover -s tests -t . -v

  policy:
    name: Static & policy validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run static/policy checks (stdlib-only, offline frontend, read-only package)
        run: python scripts/ci_validate.py

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Syntax-check the frontend JavaScript
        run: node --check web/app.js

      - name: Run the end-to-end smoke test
        run: python scripts/smoke_test.py
